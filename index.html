<!doctype html>
<html lang="es">
<head>

  <link rel="stylesheet" href="styles.css?v=20260810-2">
</head>
<body data-page="home">
  <main class="shell shell--narrow">

        <span class="choice-card__number">02</span>

    <p class="admin-link"><a href="admin.html">Acceso de administración</a></p>
